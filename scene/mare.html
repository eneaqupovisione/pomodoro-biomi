<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Mare</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0f1a; cursor: pointer; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; touch-action: none; }
  .fascia { position: fixed; left: 0; right: 0; height: 16.6vh; display: flex; align-items: center; justify-content: center;
            font-family: Silkscreen, Menlo, monospace; pointer-events: none; text-align: center; text-shadow: 0 0 12px #000; }
  #timer { top: 0; font-size: min(9vh, 64px); letter-spacing: .08em; color: #dde6e4; }
  #invito { bottom: 0; font-size: min(2.6vh, 20px); color: #e6dcc8; transition: opacity .8s; padding: 0 5vw; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="timer" class="fascia">5:00</div>
<div id="invito" class="fascia">cerca la cosa più lontana che vedi</div>
<script src="../musica/brani.js"></script>
<script src="pausa.js"></script>
<script src="fondali/mare.js"></script>
<script src="suoni/mare.js"></script>
<script>
// Il mare, dall'alto: la riva di sera. Il fondale è di Gemini (fondali/mare-gemini.jpg,
// a partire da un riferimento in pixel art). Sopra, il codice: l'acqua che luccica,
// l'onda che sale sulla sabbia con la schiuma davanti e si ritira lasciando la sabbia
// bagnata, che asciuga piano. Col dito si scrive sulla sabbia, e l'onda cancella.
// Di giorno i granchi e l'ombra dei gabbiani; di notte la luna sull'acqua e la schiuma
// che si accende azzurra, come il plancton.

// ---------- La tela, come il giardino ----------
const ASPETTO = innerWidth > 0 && innerHeight > 0 ? Math.min(3, Math.max(.4, innerWidth / innerHeight)) : 1.6;
const FH = 228, FW = 2 * Math.round(114 * ASPETTO), N = FW * FH;
const ZT = 38, ZB = FH - 38;
const cv = document.getElementById('c'); cv.width = FW; cv.height = FH;
const cx = cv.getContext('2d'), img = cx.createImageData(FW, FH), d = img.data;
let seme = 5; const rnd = () => { seme = (seme * 1664525 + 1013904223) >>> 0; return seme / 4294967296; };
const hx = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function mix(x, y, c, a) { x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= FW || y >= FH) return; const i = (y * FW + x) * 4; d[i] += (c[0] - d[i]) * a; d[i + 1] += (c[1] - d[i + 1]) * a; d[i + 2] += (c[2] - d[i + 2]) * a; }
const P = { acqua: hx('#24464a'), schiuma: hx('#e4ddca'), sh: hx('#0a0a0c'), luna: hx('#d6dfe0'), plancton: hx('#7fe8ff'), granchio: hx('#c8643c'), granchio2: hx('#8e3f24') };

// ---------- Leggere il fondale: dove finisce il mare, dove comincia la sabbia asciutta ----------
let base = null;
const mareY = new Float32Array(FW), asciuttoY = new Float32Array(FW), sabbia = new Uint8Array(N);
function leggi(px) {
  base = px;
  for (let x = 0; x < FW; x++) {
    let m = 0, a = FH - 1;
    for (let y = 0; y < FH; y++) { const i = (y * FW + x) * 3; if (px[i + 2] >= px[i] + 8) m = y; else break; }
    for (let y = FH - 1; y > m; y--) { const i = (y * FW + x) * 3; if (px[i] > 115 && px[i] - px[i + 2] > 28) a = y; else if (y < a - 4) break; }
    mareY[x] = m; asciuttoY[x] = a;
  }
  // smussati, così l'onda non segue ogni pixel
  for (const v of [mareY, asciuttoY]) { const c = v.slice(); for (let x = 0; x < FW; x++) { let s = 0, n = 0; for (let u = -8; u <= 8; u++) if (x + u >= 0 && x + u < FW) { s += c[x + u]; n++; } v[x] = s / n; } }
  for (let y = 0; y < FH; y++) for (let x = 0; x < FW; x++) if (y > mareY[x] + 2) sabbia[y * FW + x] = 1;
  for (let y = 0; y < FH; y++) {
    const q = 1 - .55 * Math.max(1 - sm(0, ZT + 10, y), sm(FH - ZT - 10, FH, y));
    for (let x = 0; x < FW; x++) { const i = (y * FW + x) * 3; px[i] *= q; px[i + 1] *= q; px[i + 2] *= q; }
  }
}

// ---------- Le onde: salgono sulla sabbia, si fermano, tornano indietro ----------
const onde = [];                 // { t0, dur, forza, ph }
const bagnato = new Float32Array(N), scritto = new Float32Array(N);
function onda(t, forza) { onde.push({ t0: t, dur: 6500 + rnd() * 3500, forza: forza ?? .45 + rnd() * .55, ph: rnd() * 6 }); }
function fronte(o, x, t) {       // dove arriva l'acqua di quest'onda, nella colonna x, adesso
  const q = (t - o.t0) / o.dur; if (q < 0 || q > 1) return -1;
  const su = q < .38 ? 1 - Math.pow(1 - q / .38, 2.2) : 1 - Math.pow((q - .38) / .62, 1.6);
  const fascia = asciuttoY[x] - mareY[x], ondula = Math.sin(x * .045 + o.ph) * 3 + Math.sin(x * .13 + o.ph * 2) * 1.2;
  return mareY[x] - 4 + (fascia * .95 * o.forza + 4) * su + ondula * su;
}

// ---------- Di giorno: i granchi e l'ombra dei gabbiani ----------
const GRANCHIO = ["x...x", ".xXx.", "xXXXx", "x.x.x"];
const granchi = []; let prossimoGranchio = 5000;
function granchiDisegna(t, k) {
  if (giorno > .4 && t > prossimoGranchio && granchi.length < 2) {
    prossimoGranchio = t + 9000 + rnd() * 12000;
    const x = 20 + rnd() * (FW - 40), y = asciuttoY[Math.round(x)] - 6 + rnd() * Math.min(30, ZB - asciuttoY[Math.round(x)]);
    granchi.push({ x, y, buca: [x, y], st: 'esce', t0: t, a: 0, verso: rnd() < .5 ? 1 : -1, corse: 2 + Math.floor(rnd() * 4) });
  }
  for (let n = granchi.length - 1; n >= 0; n--) {
    const g = granchi[n], q = (t - g.t0);
    if (g.st === 'esce') { g.a = Math.min(1, q / 600); if (q > 900) { g.st = 'fermo'; g.t0 = t; g.fino = 600 + rnd() * 1800; } }
    else if (g.st === 'fermo') { if (q > g.fino) { if (g.corse-- > 0) { g.st = 'corre'; g.t0 = t; g.dx = g.verso * (6 + rnd() * 18); g.x0 = g.x; if (rnd() < .3) g.verso = -g.verso; } else { g.st = 'torna'; g.t0 = t; g.x0 = g.x; g.y0 = g.y; } } }
    else if (g.st === 'corre') { const e = Math.min(1, q / 500); g.x = g.x0 + g.dx * (1 - Math.pow(1 - e, 3)); if (e >= 1) { g.st = 'fermo'; g.t0 = t; g.fino = 400 + rnd() * 2200; } }
    else if (g.st === 'torna' || g.st === 'scappa') {
      const dur = g.st === 'scappa' ? 350 : 900, e = Math.min(1, q / dur);
      g.x = g.x0 + (g.buca[0] - g.x0) * e; g.y = g.y0 + (g.buca[1] - g.y0) * e; if (e >= 1) { g.a -= .08 * k; if (g.a <= 0) { granchi.splice(n, 1); continue; } }
    }
    if (giorno <= .4 && g.st !== 'torna' && g.st !== 'scappa') { g.st = 'torna'; g.t0 = t; g.x0 = g.x; g.y0 = g.y; }
    mix(g.buca[0], g.buca[1], P.sh, .5 * Math.min(1, g.a * 2));
    const zampe = g.st === 'corre' || g.st === 'scappa' ? Math.floor(t / 70) % 2 : 0;
    for (let u = -2; u <= 2; u++) mix(g.x + u + 1, g.y + 2, P.sh, .25 * g.a);
    GRANCHIO.forEach((riga, j) => [...riga].forEach((ch, i) => {
      if (ch === '.') return; if (ch === 'x' && j === 3 && zampe && i % 2 === 0) return;
      mix(g.x - 2 + i, g.y - 2 + j, ch === 'X' ? P.granchio : P.granchio2, g.a);
    }));
    if (g.st !== 'esce' && g.st !== 'scappa') { mix(g.x - 1, g.y - 3, [20, 20, 20], g.a); mix(g.x + 1, g.y - 3, [20, 20, 20], g.a); }
  }
}
function granchioTocca(x, y, t) {
  const g = granchi.find(g => Math.abs(g.x - x) < 6 && Math.abs(g.y - y) < 5 && g.st !== 'scappa' && g.st !== 'torna');
  if (!g) return false; g.st = 'scappa'; g.t0 = t; g.x0 = g.x; g.y0 = g.y; return true;
}
let gabbiano = null, prossimoGabbiano = 12000;
function gabbianoDisegna(t) {     // un'ombra che passa sulla sabbia e sull'acqua, le ali che battono piano
  if (!gabbiano && giorno > .4 && t > prossimoGabbiano) {
    const v = rnd() < .5 ? 1 : -1; gabbiano = { x: v > 0 ? -12 : FW + 12, y: ZT + 20 + rnd() * (ZB - ZT - 40), v, vy: (rnd() - .5) * .006, t0: t };
    prossimoGabbiano = t + 25000 + rnd() * 30000; versoGabbiano();
  }
  if (!gabbiano) return;
  const G = gabbiano, dt = t - G.t0, x = G.x + G.v * dt * .03, y = G.y + G.vy * dt;
  if (x < -14 || x > FW + 14) { gabbiano = null; return; }
  const ala = Math.sin(dt * .006) > .2 ? 1 : 0;
  for (let u = -6; u <= 6; u++) { const h = Math.abs(u) < 2 ? 0 : (Math.abs(u) - 1) * (ala ? -.35 : .15); mix(x + u, y + h, P.sh, .22); }
  mix(x + G.v * 2, y, P.sh, .22); mix(x - G.v * 2, y + 1, P.sh, .18);
}

// ---------- I cerchi del dito sull'acqua, e le scintille del plancton ----------
let cerchi = [], scintille = [];
function cerchio(x, y) { cerchi.push({ x, y, t: performance.now() }); }

// ---------- I suoni: registrati (suoni/mare.js) se ci sono ----------
// Le onde disegnate vanno a tempo con quelle che si sentono: la pagina trova nella
// registrazione le creste (dove il suono cresce) e fa partire l'onda appena prima.
let mareG = null, gabbianiBuf = null, mareInizio = 0, mareDur = 0, creste = [], posPrec = -1;
function trovaCreste(buf) {
  const sr = buf.sampleRate, passo = Math.round(sr * .1), ch = buf.getChannelData(0), env = [];
  for (let i = 0; i + passo <= ch.length; i += passo) { let s = 0; for (let j = 0; j < passo; j++) s += ch[i + j] * ch[i + j]; env.push(Math.sqrt(s / passo)); }
  const lis = env.map((_, i) => { let s = 0, n = 0; for (let u = -4; u <= 4; u++) if (env[i + u] !== undefined) { s += env[i + u]; n++; } return s / n; });
  const ord = lis.slice().sort((a, b) => a - b), mediana = ord[ord.length >> 1], alto = ord[Math.floor(ord.length * .95)];
  const c = [];
  for (let i = 3; i < lis.length - 3; i++) {
    if (lis[i] < mediana * 1.08 || lis[i] < lis[i - 1] || lis[i] < lis[i + 1]) continue;
    let massimo = true; for (let u = -20; u <= 20; u++) if (lis[i + u] > lis[i]) { massimo = false; break; }     // il più alto in ±2 s
    if (massimo) c.push({ t: i * .1, forza: Math.min(1, .35 + .65 * (lis[i] - mediana) / Math.max(1e-6, alto - mediana)) });
  }
  return c;
}
fondo = () => {
  mareG = AC.createGain(); mareG.gain.value = .0001; mareG.connect(master);
  suono('mare').then(b => { const s = ciclo(b, 2.5); s.connect(mareG); s.start(); mareInizio = AC.currentTime; mareDur = s.buffer.duration; creste = trovaCreste(s.buffer); mareG.gain.setTargetAtTime(.8, AC.currentTime, 1.5); }).catch(() => {});
  suono('gabbiani').then(b => gabbianiBuf = b).catch(() => {});
};
// i versi nella registrazione dei gabbiani (secondi dall'inizio del pezzo tagliato)
const VERSI = [.7, 1.6, 2.5, 3.1, 3.9, 5.7, 7.9, 9.7, 11.6, 15.6];
let prossimoVerso = 15000;
function versoGabbiano() {       // due o tre versi di fila, da un lato
  if (!gabbianiBuf) return; const v = VERSI[Math.floor(Math.random() * (VERSI.length - 2))];
  colpo(gabbianiBuf, Math.max(0, v - .3), 3 + Math.random() * 3, .9, (Math.random() - .5) * 1.4);
}

// ---------- La luce ----------
function colora() {
  const r0 = .36 + .64 * giorno, g0 = .44 + .56 * giorno, b0 = .72 + .28 * giorno, caldo = tramonto * 30, blu = (1 - giorno) * 8;
  for (let i = 0; i < d.length; i += 4) { d[i] = d[i] * r0 + caldo; d[i + 1] = d[i + 1] * g0 + caldo * .3; d[i + 2] = d[i + 2] * b0 + blu - caldo * .3; }
}
function luna(t) {               // il riflesso della luna: una colonna che si spezza sulle onde
  const n = 1 - giorno; if (n < .05) return; const mx = FW * .66;
  const fine = mareY[Math.round(mx)] + 4;
  for (let y = ZT - 16; y < fine; y++) {
    // più larga verso la riva, spezzata in strisce dalle onde, che scorrono piano
    const w = (2 + (y - ZT) * .1) * (.55 + .45 * Math.sin(y * .37 + t * .0011)) + Math.sin(y * .9 - t * .0017) * 1.5, o = Math.sin(y * .21 + t * .0006) * 2.5;
    const striscia = .55 + .45 * Math.sin(y * 1.1 - t * .0024);
    for (let x = -Math.ceil(w); x <= w; x++) mix(mx + o + x, y, P.luna, .45 * n * striscia * (1 - Math.abs(x) / (w + 1)) * sm(ZT - 16, ZT + 24, y));
  }
}

// ---------- Il tocco ----------
let giu = false, ultimo = null;
function punto(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * FW, (e.clientY - r.top) / r.height * FH]; }
function inAcqua(x, y, t) { const X = Math.max(0, Math.min(FW - 1, Math.round(x))); if (y <= mareY[X] + 2) return true; return onde.some(o => fronte(o, X, t) > y); }
function scrivi(x0, y0, x1, y1) {
  const l = Math.max(.1, Math.hypot(x1 - x0, y1 - y0));
  for (let s = 0; s <= l; s += .5) {
    const X = x0 + (x1 - x0) * s / l, Y = y0 + (y1 - y0) * s / l;
    for (let v = -1; v <= 1; v++) for (let u = -1; u <= 1; u++) {
      const px = Math.round(X + u), py = Math.round(Y + v); if (px < 0 || py < 0 || px >= FW || py >= FH) continue;
      const i = py * FW + px; if (sabbia[i]) scritto[i] = Math.max(scritto[i], u * u + v * v > 1 ? .45 : 1);
    }
  }
}
cv.addEventListener('pointerdown', e => {
  audio(); if (AC && AC.state === 'suspended' && !document.hidden) AC.resume();
  const [x, y] = punto(e), t = performance.now(); giu = true;
  if (granchioTocca(x, y, t)) { ultimo = null; return; }
  if (inAcqua(x, y, t)) { cerchio(x, y); if (giorno < .5) for (let k = 0; k < 10; k++) scintille.push({ x: x + (rnd() - .5) * 10, y: y + (rnd() - .5) * 6, t, v: rnd() }); ultimo = null; return; }
  ultimo = [x, y]; scrivi(x, y, x, y);
});
cv.addEventListener('pointermove', e => {
  if (!giu || !ultimo) return; const [x, y] = punto(e); scrivi(ultimo[0], ultimo[1], x, y); ultimo = [x, y];
});
addEventListener('pointerup', () => { giu = false; ultimo = null; });

// ---------- Il giro ----------
let prec = 0, prossimaOnda = 0;
const fr = new Float32Array(FW);
function frame(t) {
  const k = prec ? Math.min(3, Math.max(0, (t - prec) / 16.7)) : 1; prec = t;
  if (creste.length && AC && AC.state === 'running') {      // a tempo col suono
    const pos = (AC.currentTime - mareInizio) % mareDur;
    if (posPrec >= 0) for (const c of creste) {
      const via = (c.t - .9 + mareDur) % mareDur;               // l'onda parte 0,9 s prima della cresta
      if (posPrec <= pos ? via > posPrec && via <= pos : via > posPrec || via <= pos) onda(t, c.forza);
    }
    posPrec = pos;
    // la musica cresce con l'onda e cala con la risacca, circa ogni 10 secondi: accompagna il respiro
    let vicina = 0;
    for (const c of creste) { const d = Math.min(Math.abs(pos - c.t), mareDur - Math.abs(pos - c.t)); vicina = Math.max(vicina, c.forza * Math.exp(-d * d / 8)); }
    respiro = .65 + .35 * Math.min(1, vicina);
  } else if (t > prossimaOnda) { prossimaOnda = t + 4200 + rnd() * 4200; onda(t); }
  for (let n = onde.length - 1; n >= 0; n--) if (t - onde[n].t0 > onde[n].dur) onde.splice(n, 1);
  // dove arriva l'acqua adesso, colonna per colonna (la più alta fra le onde)
  for (let x = 0; x < FW; x++) { let f = mareY[x] - 4; for (const o of onde) f = Math.max(f, fronte(o, x, t)); fr[x] = f; }
  const notte = 1 - giorno, asciuga = Math.pow(.9994, k), sbiadisce = Math.pow(.99985, k);
  for (let y = 0, i = 0; y < FH; y++) for (let x = 0; x < FW; x++, i++) {
    let s = i;
    if (y < mareY[x] - 1) {      // l'acqua luccica: ogni pixel prende il colore di un vicino che si muove
      const dx = Math.round(Math.sin(t * .0011 + y * .31 + Math.sin(x * .05 + t * .0004) * 2) * .8);
      if (x + dx >= 0 && x + dx < FW) s = i + dx;
    }
    let r = base[s * 3], g = base[s * 3 + 1], b = base[s * 3 + 2];
    const j = i * 4, f = fr[x];
    if (y > mareY[x] - 2 && y < f) {   // l'acqua dell'onda sopra la sabbia, più sottile verso il fronte
      const prof = Math.max(0, Math.min(1, (f - y) / 14)), a = .25 + .45 * prof;
      r += (P.acqua[0] - r) * a; g += (P.acqua[1] - g) * a; b += (P.acqua[2] - b) * a;
      bagnato[i] = 1; scritto[i] = 0;
    } else if (bagnato[i] > .01) { const q = .22 * bagnato[i]; r *= 1 - q; g *= 1 - q; b *= 1 - q * .8; bagnato[i] *= asciuga; }
    if (scritto[i] > .02) { const q = scritto[i] * (bagnato[i] > .3 ? .35 : .22); r *= 1 - q; g *= 1 - q; b *= 1 - q; scritto[i] *= sbiadisce; }
    d[j] = r; d[j + 1] = g; d[j + 2] = b; d[j + 3] = 255;
  }
  // la schiuma sul fronte, che si rompe; di notte si accende azzurra
  for (let x = 0; x < FW; x++) {
    const f = fr[x]; if (f <= mareY[x]) continue;
    for (let w = 0; w < 3; w++) {
      const rot = Math.sin(x * .7 + t * .003 + w * 2) + Math.sin(x * .23 - t * .002) > -.4 - w * .3;
      if (!rot) continue; const a = (w === 0 ? .85 : w === 1 ? .45 : .2);
      mix(x, f - w, P.schiuma, a);
      if (notte > .3) mix(x, f - w, P.plancton, a * .7 * notte);
    }
  }
  granchiDisegna(t, k);
  // i cerchi del dito
  cerchi = cerchi.filter(c => { const q = (t - c.t) / 2500; if (q > 1) return false; for (let a = 0; a < 6.28; a += .06) mix(c.x + Math.cos(a) * q * 18, c.y + Math.sin(a) * q * 8, P.schiuma, (1 - q) * .45); return true; });
  colora(); luna(t); gabbianoDisegna(t);
  if (giorno > .4 && t > prossimoVerso) { prossimoVerso = t + 20000 + rnd() * 25000; versoGabbiano(); }   // anche senza ombra: sono lontani
  // le scintille del plancton, dopo la luce perché brillano da sole
  scintille = scintille.filter(s => { const q = (t - s.t) / 1600; if (q > 1) return false; mix(s.x + Math.sin(q * 6 + s.v * 9), s.y, P.plancton, (1 - q) * .9 * (.6 + .4 * Math.sin(t * .02 + s.v * 20))); return true; });
  if (notte > .3) for (let x = 0; x < FW; x += 3) if (rnd() < .01 * k) { const f = fr[x]; if (f > mareY[x] + 4) scintille.push({ x, y: f - 1 - rnd() * 4, t, v: rnd() }); }
  cx.putImageData(img, 0, 0);
  requestAnimationFrame(frame);
}
audio();
caricaFondale(FONDALE, FW, FH).then(px => { leggi(px); requestAnimationFrame(frame); });
</script>
</body>
</html>
