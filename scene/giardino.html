<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Giardino</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d10; cursor: pointer; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; touch-action: none; }
  .fascia { position: fixed; left: 0; right: 0; height: 16.6vh; display: flex; align-items: center; justify-content: center;
            font-family: Silkscreen, Menlo, monospace; pointer-events: none; text-align: center; text-shadow: 0 0 12px #000; }
  #timer { top: 0; font-size: min(9vh, 64px); letter-spacing: .08em; color: #e2dccf; }
  #invito { bottom: 0; font-size: min(2.6vh, 20px); color: #c4bcaa; transition: opacity .8s; padding: 0 5vw; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="timer" class="fascia">5:00</div>
<div id="invito" class="fascia">cerca la cosa più lontana che vedi</div>
<script src="../musica/brani.js"></script>
<script src="pausa.js"></script>
<script src="fondali/giardino.js"></script>
<script src="suoni/giardino.js"></script>
<script>
// Il giardino zen con l'acero rosso. Il fondale è di Gemini (fondali/giardino-gemini.jpg,
// fatto a partire da un riferimento in pixel art), ridotto a pixel veri;
// sopra, il codice: la chioma che trema col vento, le foglie che cadono, il dito
// che rastrella la ghiaia (il solco si richiude piano), le lanterne accese di notte,
// i kodama di giorno e gli onibi di notte.
// Le parti si riconoscono dal colore: rosso fitto la chioma, grigio la ghiaia,
// giallo caldo le lanterne.

// ---------- La tela: la griglia del fondale, circa 3 pixel di Gemini per pixel ----------
const ASPETTO = innerWidth > 0 && innerHeight > 0 ? Math.min(3, Math.max(.4, innerWidth / innerHeight)) : 1.6;
const FH = 228, FW = 2 * Math.round(114 * ASPETTO), N = FW * FH;
const ZT = 38, ZB = FH - 38;
const cv = document.getElementById('c'); cv.width = FW; cv.height = FH;
const cx = cv.getContext('2d'), img = cx.createImageData(FW, FH), d = img.data;
const hx = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const P = { sh: hx('#07080a'), lume: hx('#f2c26e') };
let seme = 7; const rnd = () => { seme = (seme * 1664525 + 1013904223) >>> 0; return seme / 4294967296; };
function set(x, y, c) { x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= FW || y >= FH) return; const i = (y * FW + x) * 4; d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; }
function mix(x, y, c, a) { x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= FW || y >= FH) return; const i = (y * FW + x) * 4; d[i] += (c[0] - d[i]) * a; d[i + 1] += (c[1] - d[i + 1]) * a; d[i + 2] += (c[2] - d[i + 2]) * a; }

// ---------- Leggere il fondale: dove sono chioma, ghiaia, lanterne ----------
let base = null;
const chioma = new Uint8Array(N), ghiaia = new Uint8Array(N), puntiChioma = [], lanterne = [], coloriFoglie = [], ripari = [];
let piano = [70, 74, 82];
function leggi(px) {
  base = px;
  const rosso = new Uint8Array(N);
  for (let i = 0; i < N; i++) {
    const r = px[i * 3], g = px[i * 3 + 1], b = px[i * 3 + 2], mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    rosso[i] = r > 60 && r > g * 1.7 && r > b * 1.5 ? 1 : 0;
    const y = Math.floor(i / FW);
    if (mx - mn < 26 && mx > 34 && mx < 150 && y > FH * .3) ghiaia[i] = 1;
  }
  // la chioma: rosso fitto intorno (le foglie sparse a terra non tremano)
  let sg = [0, 0, 0, 0];
  for (let y = 3; y < FH - 3; y++) for (let x = 3; x < FW - 3; x++) {
    const i = y * FW + x; if (!rosso[i]) { if (ghiaia[i]) { sg[0] += px[i * 3]; sg[1] += px[i * 3 + 1]; sg[2] += px[i * 3 + 2]; sg[3]++; } continue; }
    let s = 0; for (let v = -3; v <= 3; v++) for (let u = -3; u <= 3; u++) s += rosso[i + v * FW + u];
    if (s > 30) { chioma[i] = 1; puntiChioma.push(i); if (px[i * 3] > 110) coloriFoglie.push([px[i * 3], px[i * 3 + 1], px[i * 3 + 2]]); }
  }
  if (sg[3]) piano = [sg[0] / sg[3], sg[1] / sg[3], sg[2] / sg[3]];
  // le lanterne: grumi di giallo caldo
  for (let i = 0; i < N; i++) {
    const r = px[i * 3], g = px[i * 3 + 1], b = px[i * 3 + 2];
    if (r > 150 && g > 100 && r - b > 55 && !chioma[i]) {
      const x = i % FW, y = Math.floor(i / FW);
      let L = lanterne.find(l => Math.abs(l.x - x) < 10 && Math.abs(l.y - y) < 10);
      if (!L) lanterne.push(L = { x, y, ph: rnd() * 6, fiamma: [] });
      L.fiamma.push(i);
    }
  }
  if (!coloriFoglie.length) coloriFoglie.push([170, 40, 30]);
  // dove si affacciano i kodama: ghiaia con qualcosa subito dietro (una pietra, una radice, una lanterna)
  for (let y = ZT + 30; y < ZB - 8; y++) for (let x = 10; x < FW - 10; x++) {
    const i = y * FW + x; if (ghiaia[i] && ghiaia[i + FW] && !ghiaia[i - 4 * FW] && !ghiaia[i - 5 * FW] && !chioma[i - 4 * FW]) ripari.push([x, y]);
  }
  // più scuro verso il timer e l'invito, senza bande
  for (let y = 0; y < FH; y++) {
    const f = 1 - .6 * Math.max(1 - sm(0, ZT + 10, y), sm(FH - ZT - 10, FH, y));
    for (let x = 0; x < FW; x++) { const i = (y * FW + x) * 3; px[i] *= f; px[i + 1] *= f; px[i + 2] *= f; }
  }
}

// ---------- Il rastrello: il dito lascia cinque solchi, che si richiudono ----------
const solco = new Float32Array(N), segno = new Int8Array(N);
function rastrella(x0, y0, x1, y1) {
  const l = Math.hypot(x1 - x0, y1 - y0); if (l < .1) return;
  const ux = (x1 - x0) / l, uy = (y1 - y0) / l;
  for (let s = 0; s <= l; s += .5) for (let o = -7; o <= 7; o++) {
    const X = Math.round(x0 + ux * s - uy * o), Y = Math.round(y0 + uy * s + ux * o);
    if (X < 0 || X >= FW || Y < 0 || Y >= FH) continue;
    const i = Y * FW + X; if (!ghiaia[i]) continue;
    const m = ((o % 3) + 3) % 3;
    solco[i] = Math.abs(o) === 7 ? Math.max(solco[i], .5) : 1; segno[i] = Math.abs(o) === 7 ? 0 : m === 0 ? -1 : m === 1 ? 1 : 0;
  }
}

// ---------- Le foglie: si staccano dalla chioma, l'ombra le raggiunge a terra ----------
const foglie = [], FOGLIA = [".x.x.", "xxxxx", ".xxx.", "..x.."];
function cade() {
  if (!puntiChioma.length) return; const i = puntiChioma[Math.floor(rnd() * puntiChioma.length)];
  const c = coloriFoglie[Math.floor(rnd() * coloriFoglie.length)];
  foglie.push({ x: i % FW, y: Math.floor(i / FW), h: 1, ph: rnd() * 6, gira: (rnd() - .5) * .08, an: rnd() * 6, c, c2: c.map(v => v * .75), eta: 0 });
}
function foglia(f, t, k) {
  if (f.h > 0) {
    f.h = Math.max(0, f.h - .003 * k); f.an += f.gira * k;
    f.x += (Math.sin(t * .0015 + f.ph) * .25 - .1 - vento * .25) * k; f.y += (.09 + Math.cos(t * .0011 + f.ph) * .06) * k;
  } else f.eta += k;
  const svanisce = Math.max(0, 1 - Math.max(0, f.eta - 5400) / 900);
  const ca = Math.cos(f.an), sa = Math.sin(f.an), ox = f.h * 10, oy = f.h * 12;
  FOGLIA.forEach((riga, j) => [...riga].forEach((ch, i) => {
    if (ch !== 'x') return; const u = i - 2, v = j - 1.5, X = f.x + u * ca - v * sa, Y = f.y + u * sa + v * ca;
    if (f.h > 0) mix(X + ox, Y + oy, P.sh, .4 * (1 - f.h));
    mix(X, Y, (i + j) & 1 ? f.c : f.c2, svanisce);
  }));
  return svanisce > 0 && f.x > -10 && f.y < FH + 10;
}

// ---------- Gli yokai: di giorno i kodama, di notte gli onibi ----------
// I kodama, gli spiriti degli alberi, si affacciano dai ripari, guardano, inclinano
// la testa con un ticchettio di legno e se ne vanno. Sono timidi: se stai fermo
// ne escono di più, se li tocchi spariscono. Disegnati qui, non presi da nessuno.
const KODAMA = [".www.", "wwwww", "wkwkw", "wwwwW", "wwwwW", ".wwW.", ".w.w."];
const KC = { w: [214, 218, 200], W: [170, 174, 158], k: [24, 26, 24] };
const kodama = []; let prossimoKodama = 6000, ultimoTocco = 0;
function kodamaNasce(t) {
  if (!ripari.length) return; const [x, y] = ripari[Math.floor(rnd() * ripari.length)];
  if (kodama.some(o => Math.hypot(o.x - x, o.y - y) < 30) || lanterne.some(l => Math.hypot(l.x - x, l.y - y) < 12)) return;
  kodama.push({ x, y, a: 0, st: 'appare', t0: t, fino: t + 1500, tilt: 0, batte: t + 2000 + rnd() * 3000, passi: rnd() < .5 ? 1 + Math.floor(rnd() * 2) : 0 });
}
function kodamaDisegna(t, k) {
  const fermo = t - ultimoTocco > 15000;
  if (giorno > .35 && t > prossimoKodama) { prossimoKodama = t + (fermo ? 5000 : 14000) + rnd() * 6000; if (kodama.length < (fermo ? 4 : 2)) kodamaNasce(t); }
  for (let n = kodama.length - 1; n >= 0; n--) {
    const o = kodama[n], q = Math.min(1, (t - o.t0) / Math.max(1, o.fino - o.t0));
    if (o.st === 'appare') { o.a = q; if (q >= 1) { o.st = 'guarda'; o.t0 = t; o.fino = t + 3000 + rnd() * 6000; } }
    else if (o.st === 'guarda') {
      if (t > o.batte) { o.tilt = o.tilt ? 0 : (rnd() < .5 ? -1 : 1); o.batte = t + 1500 + rnd() * 3500; if (o.tilt) karakara(); }
      if (q >= 1) {
        if (o.passi-- > 0) { o.st = 'cammina'; o.t0 = t; o.fino = t + 1600; o.dx = (rnd() < .5 ? -1 : 1) * (3 + rnd() * 4); o.x0 = o.x; }
        else { o.st = 'via'; o.t0 = t; o.fino = t + 1300; }
      }
    } else if (o.st === 'cammina') {
      o.x = o.x0 + o.dx * q; if (q >= 1) { o.st = 'guarda'; o.t0 = t; o.fino = t + 2000 + rnd() * 4000; }
    } else { o.a = 1 - q; if (q >= 1) { kodama.splice(n, 1); continue; } }
    if (giorno <= .35 && o.st !== 'via') { o.st = 'via'; o.t0 = t; o.fino = t + 1300; }
    if (o.fuga) o.tilt = q < .45 ? (Math.floor(t / 60) % 2 ? 1 : -1) : 0;   // toccato: scuote la testa, poi salta via
    const su = o.st === 'cammina' ? Math.abs(Math.sin(q * Math.PI * 4)) * 1.2 : o.fuga ? Math.max(0, q - .45) * 14 : 0;
    const occhi = (t % 4200) > 140;
    for (let u = -3; u <= 3; u++) mix(o.x + u, o.y + 1, P.sh, .35 * o.a * (1 - Math.abs(u) / 4));
    KODAMA.forEach((riga, j) => [...riga].forEach((ch, i) => {
      if (ch === '.') return; const c = ch === 'k' && !occhi ? KC.w : KC[ch];
      mix(o.x - 2 + i + (j < 4 ? o.tilt * (j < 2 ? 1 : .5) : 0), o.y - 7 + j - su, c, o.a);
    }));
  }
}
function kodamaTocca(x, y, t) {
  const o = kodama.find(o => o.st !== 'via' && Math.abs(o.x - x) < 6 && o.y - y > -3 && o.y - y < 11);
  if (!o) return false; o.st = 'via'; o.fuga = true; o.t0 = t; o.fino = t + 900; karakara(); pupon(); return true;
}
// Gli onibi: fuochi fatui azzurri, di notte, che fluttuano piano e scappano dal dito
const onibi = Array.from({ length: 4 }, (_, i) => { const cx = FW * (.15 + i * .23 + rnd() * .08), cy = ZT + 40 + rnd() * (ZB - ZT - 70); return { x: cx, y: cy, cx, cy, vx: 0, vy: 0, ph: i * 1.7 + rnd() }; });
let puntatore = [-999, -999];
const ONIc = [hx('#bfeaff'), hx('#6fb8f0'), hx('#3a78c8')];
function iridesce(c, t, q) {   // per un attimo l'azzurro gira verso il viola e il verde
  const h = t * .006; return [c[0] + (Math.sin(h) * .5 + .5) * 120 * q, c[1] + (Math.sin(h + 2.1) * .5 + .5) * 60 * q - 30 * q, c[2]];
}
function onibiTocca(x, y, t) {
  const f = onibi.find(f => Math.hypot(f.x - x, f.y - y) < 14); if (!f || sm(.55, .15, giorno) < .1) return false;
  f.colpo = t; f.soffio = t; f.vx += (Math.random() - .5) * .5; f.vy -= .3; wuu(); return true;
}
function onibiDisegna(t, k) {
  const n = sm(.55, .15, giorno); if (n < .02) return;
  for (const f of onibi) {
    f.vx += (Math.sin(t * .0003 + f.ph) * .002 + (f.cx - f.x) / FW * .006 - f.vx * .012) * k;
    f.vy += (Math.cos(t * .00023 + f.ph * 1.3) * .0015 + (f.cy - f.y) / FH * .006 - f.vy * .012) * k;
    const dx = f.x - puntatore[0], dy = f.y - puntatore[1], dd = Math.hypot(dx, dy);
    if (dd < 30 && t - (f.colpo || -1e4) > 1800) { f.vx += dx / dd * .012 * k; f.vy += dy / dd * .012 * k; if (t - (f.soffio || 0) > 1500) { f.soffio = t; soffio(); } }
    f.x += f.vx * k * 1.2; f.y += f.vy * k * 1.2;
    if (f.x < 20 || f.x > FW - 20) f.vx = -f.vx * .8, f.x = Math.max(20, Math.min(FW - 20, f.x));
    if (f.y < ZT + 14 || f.y > ZB - 10) f.vy = -f.vy * .8, f.y = Math.max(ZT + 14, Math.min(ZB - 10, f.y));
    const fl = (.7 + .3 * Math.sin(t * .006 + f.ph * 3)) * n * (1 + Math.max(0, 1 - (t - (f.colpo || -1e4)) / 1800) * .6), Y = f.y + Math.sin(t * .002 + f.ph) * 1.5;
    const iri = Math.max(0, 1 - (t - (f.colpo || -1e4)) / 1800), ONI = iri > 0 ? ONIc.map(c => iridesce(c, t, iri)) : ONIc;
    for (let y = -14; y <= 14; y++) for (let x = -14; x <= 14; x++) { const r = Math.hypot(x, y * 1.1) / 14; if (r < 1) mix(f.x + x, Y + y, ONI[1], (1 - r) * (1 - r) * .3 * fl); }
    // la fiamma: tonda in basso, una punta che si piega in alto
    for (let y = -1; y <= 2; y++) for (let x = -2; x <= 2; x++) { const r = Math.hypot(x, y - .5); if (r < 2.3) mix(f.x + x, Y + y, ONI[r < 1.2 ? 0 : r < 1.9 ? 1 : 2], .95 * fl); }
    const coda = Math.sin(t * .009 + f.ph);
    for (let j = 2; j <= 6; j++) { const w = j < 4 ? 1 : 0; for (let x = -w; x <= w; x++) mix(f.x + x + Math.round(coda * j * .4), Y - j, ONI[j < 4 ? 1 : 2], (1 - j / 8) * .9 * fl); }
  }
}

// ---------- I suoni: le foglie nel vento (registrate), il bambù, la ghiaia, la civetta ----------
// Le foglie sono due registrazioni vere (suoni/LEGGIMI.md) che il vento della scena mescola:
// la più calma sempre, la seconda cresce nelle folate. Niente soffio continuo: il crepitio
// delle foglie mosse dal vento, e qualche folata; fatto col codice era finto.
let calmaG = null, folataG = null, ghiaiaG = null, foglieBuf = null;
fondo = () => {
  calmaG = AC.createGain(); calmaG.gain.value = .0001; calmaG.connect(master);
  folataG = AC.createGain(); folataG.gain.value = .0001; folataG.connect(master);
  suono('foglie').then(b => { const s = ciclo(b, 2); s.connect(calmaG); s.start(); }).catch(() => {});
  suono('foglie2').then(b => { foglieBuf = b; const s = ciclo(b, 1.5); s.connect(folataG); s.start(); }).catch(() => {});
  const g = rumore(2, .9), bp2 = AC.createBiquadFilter(); bp2.type = 'bandpass'; bp2.frequency.value = 3200; bp2.Q.value = .8;
  ghiaiaG = AC.createGain(); ghiaiaG.gain.value = 0; g.connect(bp2); bp2.connect(ghiaiaG); ghiaiaG.connect(master); g.start();
};
function scuoti() {             // l'albero scosso: un pezzo di foglie registrate, più forte
  if (!AC || !foglieBuf) return; colpo(foglieBuf, Math.random() * (foglieBuf.duration - 2), 1.6, 1.1, (Math.random() - .5) * .6);
}
function bambu() {             // lo shishi-odoshi: il colpo di legno, poi l'acqua che si versa
  if (!AC) return; const t = AC.currentTime;
  // un tonfo di legno cavo, lontano: prima era un colpo acuto che sembrava una notifica
  for (const [f, v, c] of [[310, .028, .16], [150, .035, .3]]) {
    const o = AC.createOscillator(), g = AC.createGain(), lp = AC.createBiquadFilter(); o.type = 'sine'; lp.type = 'lowpass'; lp.frequency.value = 900;
    o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * .8, t + c); inviluppo(g, t, v, .008, c);
    o.connect(lp); lp.connect(g); g.connect(master); o.start(t); o.stop(t + c + .05);
  }
  const s = rumore(1, .3), lp = AC.createBiquadFilter(), g = AC.createGain(); lp.type = 'lowpass'; lp.frequency.value = 1400;
  inviluppo(g, t + .12, .025, .08, .8); s.connect(lp); lp.connect(g); g.connect(master); s.start(t + .1); s.stop(t + 1.2);
}
function karakara() {          // il kodama inclina la testa: un ticchettio di legno
  if (!AC) return; const t0 = AC.currentTime;
  for (let k = 0; k < 3 + Math.floor(Math.random() * 3); k++) {
    const t = t0 + k * (.05 + Math.random() * .03), o = AC.createOscillator(), g = AC.createGain();
    o.type = 'triangle'; o.frequency.value = 1500 + Math.random() * 500; inviluppo(g, t, .06, .002, .035);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + .05);
  }
}
function soffio() {            // un onibi che scappa: un soffio d'aria che scende
  if (!AC) return; const t = AC.currentTime, s = rumore(1, .8), bp = AC.createBiquadFilter(), g = AC.createGain();
  bp.type = 'bandpass'; bp.Q.value = 3; bp.frequency.setValueAtTime(2400, t); bp.frequency.exponentialRampToValueAtTime(700, t + .5);
  inviluppo(g, t, .06, .08, .45); s.connect(bp); bp.connect(g); g.connect(master); s.start(t); s.stop(t + .7);
}
function pupon() {             // il kodama toccato: due note di legno, la seconda più alta
  if (!AC) return; const t0 = AC.currentTime;
  for (const [dt, f] of [[0, 784], [.13, 1175]]) {
    const t = t0 + dt, o = AC.createOscillator(), o2 = AC.createOscillator(), g = AC.createGain();
    o.type = 'triangle'; o.frequency.value = f; o2.frequency.value = f * 3.01; const g2 = AC.createGain(); g2.gain.value = .25;
    inviluppo(g, t, .07, .003, .25); o.connect(g); o2.connect(g2); g2.connect(g); g.connect(master); o.start(t); o2.start(t); o.stop(t + .3); o2.stop(t + .3);
  }
}
function wuu() {               // l'onibi toccato: una nota che ondeggia, scende, e rimbomba nell'eco
  if (!AC) return; const t = AC.currentTime, dur = 2.2;
  const eco = AC.createDelay(1), ritorno = AC.createGain(), uscita = AC.createGain(); eco.delayTime.value = .27; ritorno.gain.value = .45; uscita.gain.value = 1;
  eco.connect(ritorno); ritorno.connect(eco); eco.connect(uscita); uscita.connect(master);
  const vib = AC.createOscillator(), vg = AC.createGain(); vib.frequency.setValueAtTime(5, t); vib.frequency.linearRampToValueAtTime(9, t + dur); vg.gain.value = 18; vib.connect(vg);
  for (const det of [0, 7, -5]) {
    const o = AC.createOscillator(), g = AC.createGain(), lp = AC.createBiquadFilter(); o.type = det ? 'triangle' : 'sine'; lp.type = 'lowpass'; lp.frequency.value = 1600;
    o.frequency.setValueAtTime(420 + det, t); o.frequency.exponentialRampToValueAtTime(680 + det, t + .35); o.frequency.exponentialRampToValueAtTime(210 + det, t + dur);
    o.detune.value = det * 3; vg.connect(o.frequency);
    inviluppo(g, t, det ? .018 : .035, .12, dur); o.connect(lp); lp.connect(g); g.connect(master); g.connect(eco);
    o.start(t); o.stop(t + dur + .1);
  }
  vib.start(t); vib.stop(t + dur + .1);
  setTimeout(() => { try { ritorno.disconnect(); uscita.disconnect(); } catch (e) {} }, (dur + 3) * 1000);
}
function civetta() {
  if (!AC) return; const t0 = AC.currentTime;
  for (const [dt, dur] of [[0, .35], [.6, .2], [.85, .5]]) {
    const t = t0 + dt, o = AC.createOscillator(), g = AC.createGain();
    o.frequency.setValueAtTime(390, t); o.frequency.linearRampToValueAtTime(350, t + dur); inviluppo(g, t, .035, .06, dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .1);
  }
}

// ---------- La luce ----------
function colora() {
  const r0 = .36 + .64 * giorno, g0 = .44 + .56 * giorno, b0 = .72 + .28 * giorno, caldo = tramonto * 26, blu = (1 - giorno) * 7;
  for (let i = 0; i < d.length; i += 4) { d[i] = d[i] * r0 + caldo; d[i + 1] = d[i + 1] * g0 + caldo * .25; d[i + 2] = d[i + 2] * b0 + blu - caldo * .3; }
}
function lumi(t) {             // le lanterne: di notte illuminano la ghiaia intorno, e tremano
  const n = .15 + .85 * (1 - giorno);
  for (const L of lanterne) {
    const fl = .85 + Math.sin(t * .004 + L.ph) * .08 + Math.sin(t * .011 + L.ph * 2) * .05;
    for (let y = -28; y <= 28; y++) for (let x = -28; x <= 28; x++) { const dd = Math.hypot(x, y * 1.2) / 28; if (dd < 1) mix(L.x + x, L.y + y + 4, P.lume, (1 - dd) * (1 - dd) * .3 * n * fl); }
    for (const i of L.fiamma) { const j = i * 4; d[j] = Math.min(255, base[i * 3] * fl * 1.1); d[j + 1] = Math.min(255, base[i * 3 + 1] * fl * 1.1); d[j + 2] = base[i * 3 + 2] * fl; }
  }
}

// ---------- Il tocco ----------
let giu = false, ultimo = null;
function punto(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * FW, (e.clientY - r.top) / r.height * FH]; }
function sullaChioma(x, y) { const i = Math.round(y) * FW + Math.round(x); return i >= 0 && i < N && chioma[i]; }
cv.addEventListener('pointerdown', e => {
  audio(); if (AC && AC.state === 'suspended' && !document.hidden) AC.resume();
  const [x, y] = punto(e); giu = true; ultimoTocco = performance.now(); puntatore = [x, y];
  if (kodamaTocca(x, y, performance.now()) || onibiTocca(x, y, performance.now())) { ultimo = null; return; }
  if (sullaChioma(x, y)) { for (let k = 0; k < 3 + rnd() * 3; k++) cade(); scossa = performance.now(); scuoti(); ultimo = null; }
  else ultimo = [x, y, performance.now()];
});
cv.addEventListener('pointermove', e => {
  puntatore = punto(e);
  if (!giu || !ultimo) return; const [x, y] = punto(e), ora = performance.now(); ultimoTocco = ora;
  rastrella(ultimo[0], ultimo[1], x, y);
  const vel = Math.hypot(x - ultimo[0], y - ultimo[1]) / Math.max(8, ora - ultimo[2]);
  if (ghiaiaG) ghiaiaG.gain.setTargetAtTime(Math.min(.12, vel * .25), AC.currentTime, .04);
  ultimo = [x, y, ora];
});
addEventListener('pointerup', () => { giu = false; ultimo = null; if (ghiaiaG) ghiaiaG.gain.setTargetAtTime(0, AC.currentTime, .08); });

// ---------- Il giro ----------
let vento = .3, scossa = -1e4, prec = 0, prossimoBambu = 9000 + Math.random() * 10000, prossimaCivetta = 10000 + Math.random() * 10000;
const SOLCO = piano => [piano.map(v => v * .68), piano.map(v => v * 1.22), piano];
function frame(t) {
  const k = prec ? Math.min(3, (t - prec) / 16.7) : 1; prec = t;
  vento = Math.max(0, .35 + .4 * Math.sin(t * .00013) * Math.sin(t * .00041 + 1) + .25 * Math.sin(t * .00071 + 2)) + (t - scossa < 900 ? 1.5 : 0);
  if (calmaG && Math.floor(t / 400) !== Math.floor((t - 16.7 * k) / 400)) {
    const folata = Math.max(0, Math.min(1.2, vento) - .3);
    calmaG.gain.setTargetAtTime(.35 + Math.min(.5, vento * .4), AC.currentTime, 1.2); folataG.gain.setTargetAtTime(folata * folata * 1.4, AC.currentTime, 1.5);
  }
  const dec = Math.pow(.9991, k), [cS, cC, cP] = SOLCO(piano), amp = .5 + vento * 1.1;
  for (let i = 0, j = 0; i < N; i++, j += 4) {
    let s = i;
    if (chioma[i]) {              // la chioma trema: ogni foglia prende il colore della vicina
      const x = i % FW, y = (i - x) / FW, dx = Math.round(Math.sin(t * .0013 + y * .23 + x * .05) * amp), dy = Math.round(Math.sin(t * .0009 + x * .19) * amp * .5);
      const q = i + dx + dy * FW; if (q >= 0 && q < N && chioma[q]) s = q;
    }
    let r = base[s * 3], g = base[s * 3 + 1], b = base[s * 3 + 2];
    if (solco[i] > .01) {
      const c = segno[i] < 0 ? cS : segno[i] > 0 ? cC : cP, q = solco[i];
      r += (c[0] - r) * q; g += (c[1] - g) * q; b += (c[2] - b) * q; solco[i] *= dec;
    }
    d[j] = r; d[j + 1] = g; d[j + 2] = b; d[j + 3] = 255;
  }
  kodamaDisegna(t, k);
  for (let i = foglie.length - 1; i >= 0; i--) if (!foglia(foglie[i], t, k)) foglie.splice(i, 1);
  if (rnd() < (.006 + vento * vento * .025) * k && foglie.length < 70) cade();
  colora(); lumi(t); onibiDisegna(t, k);
  cx.putImageData(img, 0, 0);
  if (t > prossimoBambu) { prossimoBambu = t + 40000 + Math.random() * 30000; bambu(); }
  if (giorno < .4 && t > prossimaCivetta) { prossimaCivetta = t + 35000 + Math.random() * 40000; civetta(); }
  requestAnimationFrame(frame);
}
audio();
caricaFondale(FONDALE, FW, FH).then(px => { leggi(px); requestAnimationFrame(frame); });
</script>
